<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario </title>
</head>
<body>
    <center>
      <h2><a href="index.html">Regresar</a></h2></BR>

        <input type="checkbox" id="suscribir" name="suscribir" value="boletin">
<label for="suscribir">Deseo recibir el boletín de noticias</label>
<h2> EJEMPLO </h2>
<form>
  <!-- Ejemplo 1: Opción única e independiente -->
  <p><strong>Confirmación:</strong></p>
  <input type="checkbox" id="terminos" name="terminos" value="aceptado" required>
  <label for="terminos">Acepto los términos y condiciones</label>

  <br><br>

  <!-- Ejemplo 2: Selección múltiple -->
  <p><strong>Elige tus pasatiempos (puedes marcar varios):</strong></p>
  
  <input type="checkbox" id="leer" name="pasatiempos" value="lectura">
  <label for="leer">Leer libros</label><br>

  <!-- Esta casilla aparecerá marcada por defecto usando 'checked' -->
  <input type="checkbox" id="musica" name="pasatiempos" value="musica" checked>
  <label for="musica">Escuchar música</label><br>

  <input type="checkbox" id="deportes" name="pasatiempos" value="deportes">
  <label for="deportes">Hacer deporte</label><br><br>

  <button type="submit">Enviar</button>
</form>
<form action="/procesar-datos" method="POST">
  <h3>Formulario con Atributos de Checkbox</h3>

  <!-- 1. Campo Obligatorio (required) -->
  <p>
    <input type="checkbox" id="terminos" name="terminos" value="aceptados" required>
    <label for="terminos">Acepto los términos y condiciones <strong>(Obligatorio)</strong></label>
  </p>

  <!-- 2. Marcado por Defecto (checked) -->
  <p>
    <input type="checkbox" id="boletin" name="boletin" value="si" checked>
    <label for="boletin">Deseo recibir el boletín mensual (Viene marcado por defecto)</label>
  </p>

  <!-- 3. Campo Deshabilitado (disabled) -->
  <p>
    <input type="checkbox" id="premium" name="suscripcion" value="premium" disabled>
    <label for="premium">Opción Premium <em>(No disponible por el momento)</em></label>
  </p>

  <!-- 4. Foco Automático (autofocus) y Tabulación (tabindex) -->
  <p>
    <input type="checkbox" id="recordar" name="recordar" value="si" autofocus tabindex="1">
    <label for="recordar">Recordar mi sesión en este dispositivo</label>
  </p>

  <button type="submit">Enviar Formulario</button>
</form>
    </center>
</body>
</html>
